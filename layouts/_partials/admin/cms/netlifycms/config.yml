backend:
  branch: {{ site.Params.admin.branch | default "main" }}
  name: {{ site.Params.admin.git | default site.Params.admin.name | default "git-gateway" }}
  {{- with site.Params.admin.repo }}
  repo: {{ . }}
  {{- end }}

{{- with site.Params.admin.auth }}
  {{- with .base_url }}
  base_url: {{ . }}
  {{- end }}
  {{- with .app_id }}
  app_id: {{ . }}
  {{- end }}
  {{- with .api_root }}
  api_root: {{ . }}
  {{- end }}
  {{- with .auth_endpoint }}
  auth_endpoint: {{ . }}
  {{- end }}
{{- end }}

display_url: "{{ site.BaseURL }}"

{{/* Netlify CMS reads the i18n and media of Decap CMS, its successor */}}
{{ partial "admin/cms/decapcms/i18n.yml" . }}

local_backend: {{ site.Params.admin.local_backend | default true }}
locale: {{ site.Params.admin.locale | default site.Language.Lang | default "en" }}
logo_url: "./assets/logo.svg"

{{ partial "admin/cms/decapcms/media.yml" . }}

publish_mode: {{ site.Params.admin.publish_mode | default "simple" }}
slug:
  encoding: "unicode"
  clean_accents: false
  sanitize_replacement: "-"

{{ partial "admin/func/RemarshalCollections.html" . }}
