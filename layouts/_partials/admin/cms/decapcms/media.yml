{{/* Media of Decap CMS, read by Netlify and Static CMS as well: the image
  folders and, with `media.cloud`, the media library of a cloud service */}}
media_folder: {{ site.Params.admin.media.media_folder | default "/assets/images/uploads" }}
public_folder: {{ site.Params.admin.media.public_folder | default "/images/uploads" }}

{{- with site.Params.admin.media.cloud }}
media_library:
  name: "{{ .name }}"
  config:
    {{- with .cloud_name }}
    cloud_name: "{{ . }}"
    {{ end }}
    {{- with .api_key }}
    api_key: {{ . }}
    {{ end }}
    {{- with .public_key }}
    publicKey: {{ . }}
    {{ end }}
    {{- with .tabs }}
    tabs: {{ . }}
    {{ end }}
{{- end }}
