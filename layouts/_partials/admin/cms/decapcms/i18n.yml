{{/* Root `i18n` of Decap CMS, read by Netlify and Static CMS as well: every
  collection marked `i18n: true` keeps one file per locale, `_index.fr.md` next
  to `_index.en.md`, the default locale included. The data files override it
  with `single_file` (collections/types/_files.yml).

  Nothing is written for a site with one language. */}}
{{- $i18n := partial "admin/func/GetLocales.html" . -}}
{{- with $i18n.locales }}
i18n:
  structure: multiple_files
  locales: [{{ delimit . ", " }}]
  default_locale: {{ $i18n.default }}
{{- end }}
