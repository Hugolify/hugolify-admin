{{ $view_groups := (index site.Params.admin.collections .).view_groups }}
{{ if $view_groups }}
view_groups: [
  {{ range $view_groups }}
    {
      label: {{ .label | jsonify }},
      field: {{ .field | jsonify }},
      {{ with .pattern }}
      pattern: {{ . | jsonify }}
      {{ end }}
    },
  {{ end }}
],
{{ end }}
