{{/*
  Converts the shared definition of a collection, written in the keys of Decap
  CMS, to those of Pages CMS. Called by admin/func/RemarshalCollections.html on
  each collection before its remarshal.

  The names that only differ are replaced in the raw flow text
  (`folder: 'content'`); the rest needs the structure, so the collection is
  parsed and rebuilt by collection/entry.html, and written back as JSON, which
  is flow YAML too.

  Input  : string — raw (flow style) YAML of one collection
  Output : string — the collection in the keys of Pages CMS, as JSON
*/}}
{{- $item := . -}}

{{- $names := slice
  (dict "{{slug}}/_index" `{fields.title}/_index`)
  (dict "{{slug}}" `{fields.title}`)
  (dict "{{year}}" `{year}`)
  (dict "{{month}}" `{month}`)
  (dict "{{day}}" `{day}`)
  (dict "folder:" `type: 'collection', path:`)
  (dict "file:" `type: 'file', path:`)
-}}
{{- range $names -}}
  {{- range $key, $value := . -}}
    {{- $item = replace $item $key $value -}}
  {{- end -}}
{{- end -}}

{{- $multilingual := gt (len (partial "admin/func/GetLocales.html" .).locales) 0 -}}
{{- $raw := printf "content: [%s]" (partial "admin/func/CurlyApostrophes.html" $item) -}}
{{- $entries := slice -}}
{{- range (transform.Unmarshal $raw).content -}}
  {{- $entry := partial "admin/cms/pagescms/collection/entry.html" (dict "entry" . "multilingual" $multilingual) -}}
  {{- $entries = $entries | append (jsonify $entry) -}}
{{- end -}}

{{- return delimit $entries ", " -}}
