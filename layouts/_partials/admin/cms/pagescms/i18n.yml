{{/* Root `i18n` of Pages CMS (v3): the languages of the content. Collections
  and files opt in on their own `i18n`, written from the `i18n: true` of their
  shared definition: see collection/entry.html.

  Each locale carries the `label` of its Hugo language, so the language menu
  of the editor reads like the switcher of the site. Pages CMS names a locale
  Hugo does not define in English (`fr` → French).

  Nothing is written for a site with one language. */}}
{{- $i18n := partial "admin/func/GetLocales.html" . -}}
{{- with $i18n.locales }}
  {{- $labels := dict }}
  {{- range hugo.Sites }}
    {{- $name := .Language.Name }}
    {{- with .Language.Label }}
      {{- $labels = merge $labels (dict $name .) }}
    {{- end }}
  {{- end }}
i18n:
  default: {{ $i18n.default }}
  locales:
  {{- range . }}
    - code: {{ . }}
      {{- with index $labels . }}
      label: {{ . | jsonify }}
      {{- end }}
  {{- end }}
{{- end }}
