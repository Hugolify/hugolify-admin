{{/*
  Files collection
  ================
  Prints the raw (flow style) YAML of a collection of data files, such as
  `config` and `menus`: one file per name of its `files` list, written by
  `admin/datas/{name}.yml`.

  Input  : string — collection name
*/}}
{{- $collection := . -}}
{{- $files := partial "admin/collections/config/files.yml" (dict "collection" $collection) -}}
{{- if eq site.Params.admin.cms "pagescms" }}
  {{/* Waiting for: https://github.com/pages-cms/pages-cms/issues/222 */}}
  {{/* Clean output format for PagesCMS: remove first/last lines and trailing comma */}}
  {{- $files = replaceRE "(?s)^[^\n]*\n(.*)\n[^\n]*$" "$1" $files -}}
  {{- $files = replaceRE ",\\s*$" "" $files -}}
  {{ $files }}
{{- else -}}
{{- $description := i18n (printf "admin.collections.%s._description" $collection) | default false }}
{
  name: '{{ $collection }}',
  label: '{{ i18n (printf "admin.collections.%s.label" $collection) | default ($collection | humanize) }}',
  {{- with $description }}
  description: '{{ . }}',
  {{- end }}
  editor: { preview: {{ site.Params.admin.preview | default false }} },
  i18n: {
    structure: 'single_file'
  },
  {{ partial "admin/collections/config/icon.yml" $collection }}
  {{ $files }}
}
{{- end -}}
