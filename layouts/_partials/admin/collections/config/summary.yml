{{- $cms := site.Params.admin.cms | default "decapcms" -}}
{{- $file := print "admin/cms/" $cms "/collection/config/summary.yml" -}}
{{- if templates.Exists ( printf "_partials/%s" $file ) -}}
  {{- $args := . -}}
  {{- if not $args -}}
    {{- $args = "{{title}}" -}}
  {{- end -}}
  {{ partial $file $args }}
{{- end -}}