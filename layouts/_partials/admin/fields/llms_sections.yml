{{/* The sections whose pages /llms-full.txt appends to its body, as their
     Markdown source: the theme's commons/llms.html. Picked among the
     top-level sections that hold pages, under their titles, except those the
     sitemap leaves out (sitemap.disable, noIndex), such as this module's own
     admin section; a section left out of the site since stays in the file and
     is skipped by the theme. Not translated, like the rest of the file. */}}
{{- $options := slice -}}
{{- $labels := dict -}}
{{- range site.Sections -}}
  {{- if and .Pages (not .Sitemap.Disable) (ne .Params.noIndex true) -}}
    {{- $options = $options | append .Section -}}
    {{- $labels = merge $labels (dict (replace .Section "-" "_") .LinkTitle) -}}
  {{- end -}}
{{- end -}}
{{- $options = partial "admin/func/GetOptions.html" (dict "field" . "options" $options) -}}

{{- $args := dict
  "label" (i18n "admin.fields.llms_sections.label")
  "hint" (i18n "admin.fields.llms_sections.hint")
  "name" "sections"
  "options" $options
  "label_options" $labels
  "multiple" true
  "i18n" false
  -}}

{{ partial "admin/widgets/select.js" $args }}
