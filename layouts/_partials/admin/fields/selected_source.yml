{{- $name := dict "name" "source" }}
{{- if eq site.Params.admin.cms "tinacms" }}
  {{- $name = dict "name" "selected_source" "nameOverride" "source" }}
{{- end }}

{{- $options := slice "selection" "taxonomies" -}}
{{- $options = partial "admin/func/GetOptions.html" (dict "field" . "options" $options) -}}

{{- $args := dict 
  "label" (i18n "admin.fields.selected_source.label")
  "hint" (i18n "admin.fields.selected_source.hint")
  "label_options" "admin.fields.selected_source.options"
  "default" "selection"
  "options" $options
  "required" true
  -}}

{{- $args = merge $args $name }}

{{- /* Sibling fields shown for each source, hiding the others (Decap and
  Sveltia CMS, see the toggle option of widgets/select.js). The block computes
  them from its sources; params.admin.fields.selected_source.toggle lays a map
  over them, or false shows every field */}}
{{- $toggle := false }}
{{- if reflect.IsMap . }}
  {{- $toggle = .toggle | default false }}
{{- end }}
{{- with site.Params.admin.fields }}
  {{- with index . "selected_source" }}
    {{- if isset . "toggle" }}
      {{- if reflect.IsMap .toggle }}
        {{- $toggle = merge ($toggle | default dict) .toggle }}
      {{- else if not .toggle }}
        {{- $toggle = false }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- with $toggle }}
  {{- $args = merge $args (dict "toggle" .) }}
{{- end }}

{{ partial "admin/widgets/select.js" $args }}
