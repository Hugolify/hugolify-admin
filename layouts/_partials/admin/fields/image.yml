{{- $image_filter := cond site.Params.admin.media.specific_filter "image_filter" false -}}
{{- $is_background := false -}}
{{- $is_darken := false -}}
{{- $is_screenshot := false -}}
{{- $has_mobile := false -}}
{{- if reflect.IsMap . -}}
  {{- with .is_background -}}
    {{- $is_background = true -}}
  {{- end -}}
  {{- with .is_darken -}}
    {{- $is_darken = true -}}
  {{- end -}}
  {{- with .is_screenshot -}}
    {{- $is_screenshot = true -}}
  {{- end -}}
  {{- with .has_mobile -}}
    {{- $has_mobile = true -}}
  {{- end -}}
{{- end -}}

{{- $fields := slice 
  "image_src" -}}

{{- with $has_mobile -}}
  {{- $fields = $fields | append "image_src_mobile" -}}
{{- end -}}

{{- $fields = $fields | append $image_filter -}}
{{- $fields = $fields | append "image_alt" -}}
{{- $fields = $fields | append "credit" -}}

{{- with $is_screenshot -}}
  {{- $fields = $fields | append "is_screenshot" -}}
{{- end -}}
{{- with $is_background -}}
  {{- $fields = $fields | append "is_background" -}}
{{- end -}}
{{- with $is_darken -}}
  {{- $fields = $fields | append "is_darken" -}}
{{- end -}}

{{- $fields = partial "admin/func/GetFields.html" (dict "field" . "fields" $fields) -}}

{{- $args := dict 
  "label" (i18n "admin.fields.image.label" 1)
  "name" "image"
  "fields" $fields
  -}}

{{ partial "admin/widgets/object.js" $args }}
