{{/* How the organization behind the site is described in the structured
     data, in data/schema.yml: its schema.org type, a logo search engines can
     read when the header one is an SVG, its profiles on other sites. Its
     identity — legal name, head office, distinctions… — is in
     data/organization.yml, see admin/datas/organization.yml; its name, its
     social profiles, its description and slogan come from the site — see
     func/GetSchemaOrganization.html in the theme.
*/}}
{{- $fields := slice "schema_type" "schema_logo" "same_as" -}}
{{- $fields = partial "admin/func/GetFields.html" (dict "field" . "fields" $fields) -}}

{{- $args := dict 
  "label" (i18n "admin.fields.organization.label")
  "hint" (i18n "admin.fields.organization.hint")
  "name" "organization"
  "collapsed" false
  "fields" $fields
  -}}

{{ partial "admin/widgets/object.js" $args }}
