{{/* Columns of the table view. Pages CMS reads them from its `view.yml`, as they
  share the `view` object with the other view options */}}
{{- $cms := site.Params.admin.cms | default "decapcms" -}}
{{- $file := print "admin/cms/" $cms "/collection/config/summary_fields.yml" -}}
{{- if templates.Exists ( printf "partials/%s" $file ) -}}
  {{ partial $file . }}
{{- end -}}
