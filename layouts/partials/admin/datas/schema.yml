{{- $fields := slice "organization" -}}
{{- if site.Params.admin.collections.pages.enable -}}
  {{- $fields = $fields | append "contact_page" -}}
{{- end -}}
{{- $fields = $fields | append "schema_email" -}}
{
  label: '{{ i18n "admin.files.schema" }}',
  name: 'schema',
  file: 'data/schema.yml',
  {{/* Not translated, unlike most files of the collection: how the
       organization is described in schema.org terms, one @id for every
       language. Its identity is in data/organization.yml, see
       admin/datas/organization.yml; what varies, the description and the
       slogan, in data/seo.yml. */}}
  {{- partial "admin/fields/_fields.yml" $fields -}}
}
