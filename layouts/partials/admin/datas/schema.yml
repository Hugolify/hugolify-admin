{{- $fields := slice "organization" "schema_email" -}}
{
  label: '{{ i18n "admin.files.schema" }}',
  name: 'schema',
  file: 'data/schema.yml',
  {{/* Not translated, unlike the other files of the collection: an
       organization is a single entity — one address, one phone, one @id — and
       nothing in this file varies from one language to the next. What does,
       the description, comes from data/seo.yml. Decap CMS ignores this in the
       translated config collection and nests the values under its default
       locale: the theme's func/GetUntranslatedData.html reads both shapes. */}}
  i18n: false,
  {{- partial "admin/func/Untranslate.html" (partial "admin/fields/_fields.yml" $fields) -}}
}
