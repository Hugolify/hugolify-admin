{{- $nav := .nav | default "primary" -}}
{{- $fields := .fields | default (slice "links") -}}
{
  label: '{{ i18n (print "admin.files.nav." (replace $nav "/" ".")) }}',
  name: '{{ replace $nav "/" "-" }}',
  file: 'data/menu/{{ $nav }}.yml',
  i18n: true,
  {{ partial "admin/fields/_fields.yml" $fields }}
}