{{/*  Default UI of every block, written to data/blocks.yml.

      The theme's func/GetBlockUI reads that file as a layer over
      params.blocks.<block>.ui, so an integrator sets the look of a block type once
      from the CMS and it reaches the blocks already written in the content.

      `column`, `layout` and `scrollsnap` are appended to admin.fields.ui.fields because
      a site-wide default commonly sets them (a grid of 4, a list turned into a grid, a
      carousel below a breakpoint) while the per-block form keeps a shorter list.

      Not translated: how a block looks is not language content, so the file stays
      whole instead of being split per locale the way data/footer.yml is.

      A block already carrying a value opens on arrival, the rest stay folded, so the
      screen says at a glance which of the thirty types the site actually styles. The
      test matches func/GetBlockUI: a key whose value is empty is one the theme skips,
      so a block whose fields were all cleared folds back.  */}}

{{- $ui := site.Params.admin.fields.ui.fields | default (slice "theme" "grid" "offset" "align") -}}
{{- $ui = $ui | append "column" "layout" "scrollsnap" -}}
{{- $names := partial "admin/func/GetBlockNames.html" . -}}
{{/* CloudCannon takes its inputs as a map, as admin/fields/_fields.yml writes
     them: its object widget gives a `name: {…}` pair, not a list item */}}
{{- $cloudcannon := eq site.Params.admin.cms "cloudcannon" -}}
{
  label: '{{ i18n "admin.files.blocks" }}',
  name: 'blocks',
  file: 'data/blocks.yml',
  i18n: false,
  {{- if $cloudcannon }}
  options: {
  subtype: 'object',
  _inputs: {
  {{- else }}
  fields: [
  {{- end }}
    {{- /* What the file already holds, flat or keyed by language as Decap
           saves it — the theme reads it either way. */ -}}
    {{- $saved := hugo.Data.blocks -}}
    {{- if templates.Exists "partials/func/GetUntranslatedData.html" -}}
      {{- $saved = partial "func/GetUntranslatedData.html" "blocks" -}}
    {{- end -}}
    {{- range $name := $names }}
      {{- $label := i18n (printf "admin.blocks.%s.label" $name) | default (humanize $name) -}}
      {{- if strings.HasPrefix $name "selected-" -}}
        {{- $collection := strings.TrimPrefix "selected-" $name -}}
        {{- $collection_label := i18n (print "admin.collections." $collection ".label") | default (humanize $collection) -}}
        {{- $label = i18n "admin.blocks.selected.label" (dict "section" $collection_label) -}}
      {{- end -}}
      {{- $collapsed := true -}}
      {{- with $saved -}}
        {{- with index . $name -}}
          {{- with .ui -}}
            {{- if reflect.IsMap . -}}
              {{- range $value := . -}}
                {{- if $value -}}{{- $collapsed = false -}}{{- end -}}
              {{- end -}}
            {{- end -}}
          {{- end -}}
        {{- end -}}
      {{- end }}
      {{ partial "admin/widgets/object.js" (dict
        "label" $label
        "name" $name
        "i18n" false
        "collapsed" $collapsed
        "fields" (slice (dict "ui" (dict "fields" $ui "collapsed" $collapsed)))
      ) }},
    {{- end }}
  {{- if $cloudcannon }}
  }
  }
  {{- else }}
  ]
  {{- end }}
}
