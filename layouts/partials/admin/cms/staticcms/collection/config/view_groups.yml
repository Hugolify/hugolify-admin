{{/* Static CMS takes an object, and a `name` on each group, derived from its label */}}
{{- with (index site.Params.admin.collections .).view_groups }}
view_groups: {
  groups: [
    {{- range . }}
    {
      name: {{ .label | urlize | jsonify }},
      label: {{ .label | jsonify }},
      field: {{ .field | jsonify }},
      {{- with .pattern }}
      pattern: {{ . | jsonify }}
      {{- end }}
    },
    {{- end }}
  ]
},
{{- end -}}
