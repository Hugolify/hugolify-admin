backend:
  branch: {{ site.Params.admin.branch | default "main" }}
  name: {{ site.Params.admin.git | default site.Params.admin.name | default "github" }}
  {{ with site.Params.admin.repo }}
  repo: {{ . }}
  {{ end }}

  {{- /* skip_ci replaces the deprecated automatic_deployments, still honored as a fallback */}}
  {{- $skip_ci := not site.Params.admin.automatic_deployments }}
  {{- if isset site.Params.admin "skip_ci" }}
    {{- $skip_ci = site.Params.admin.skip_ci }}
  {{- end }}
  skip_ci: {{ $skip_ci }}

{{- with site.Params.admin.auth }}
  {{- with .base_url }}
  base_url: {{ . }}
  {{- end }}
  {{- with .app_id }}
  app_id: {{ . }}
  {{- end }}
  {{- with .auth_type }}
  auth_type: {{ . }}
  {{- end }}
  {{- with .api_root }}
  api_root: {{ . }}
  {{- end }}
  {{- with .auth_endpoint }}
  auth_endpoint: {{ . }}
  {{- end }}
{{- end }}

app_title: {{ site.Params.admin.title | default "Hugolify CMS" }}
display_url: {{ site.BaseURL }}

{{- if site.Params.admin.i18n.locales }}
i18n:
  structure: multiple_files
  locales: {{ site.Params.admin.i18n.locales }}
  default_locale: {{ site.Params.admin.i18n.default_locale }}
{{- end }}

local_backend: {{ site.Params.admin.local_backend | default true }}
locale: {{ site.Params.admin.locale | default site.Language.Lang | default "en" }}
logo:
  src: ./assets/logo-picto.svg
  show_in_header: true
{{- with site.Params.admin.media.media_folder }}
media_folder: {{ . }}
{{- end }}
{{- with site.Params.admin.media.public_folder }}
public_folder: {{ . }}
{{- end }}
{{- /* A mode, or an object with `type`, `stages`, `direct_publish`… */}}
publish_mode: {{ site.Params.admin.publish_mode | default "simple" | jsonify }}

{{- /* Upload options shared by the default storage and the cloud services but
  Cloudinary, written with or without a cloud service. The Asset Library takes
  any file a field accepts, so its limit is the largest of the field limits */}}
{{- $media := site.Params.admin.media }}
{{- $all := dict }}
{{- $max_file_size := 0 }}
{{- range $key, $value := $media }}
  {{- if and (strings.HasSuffix $key "max_file_size") (gt $value $max_file_size) }}
    {{- $max_file_size = $value }}
  {{- end }}
{{- end }}
{{- with $max_file_size }}
  {{- $all = merge $all (dict "max_file_size" .) }}
{{- end }}
{{- with $media.slugify_filename }}
  {{- $all = merge $all (dict "slugify_filename" true) }}
{{- end }}
{{- with $media.transformations }}
  {{- $all = merge $all (dict "transformations" .) }}
{{- end }}

{{- if or $all (isset $media "providers") $media.cloud }}
media_libraries:
  {{- with $all }}
  all: {{ . | jsonify }}
  {{- end }}
  {{- if isset $media "providers" }}
  stock_assets:
    {{- $providers := $media.providers }}
    {{- if eq $providers false }}
    providers: []
    {{- else }}
    providers:
      {{- range $providers }}
      - {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- with $media.cloud }}
  {{- $cloud := cond (reflect.IsSlice .) . (slice .) }}
  {{- range $cloud }}
  {{ .name }}:
    config:
      {{- with .cloud_name }}
      cloud_name: "{{ . }}"
      {{ end }}
      {{- with .api_key }}
      api_key: {{ . }}
      {{- end }}
      {{- with .public_key }}
      publicKey: {{ . }}
      {{- end }}
      {{- with .tabs }}
      tabs: {{ . }}
      {{- end }}
    {{- if and (eq .name "uploadcare") (ne .filename false) }}
    settings:
      autoFilename: true
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}

output:
  omit_empty_optional_fields: true

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

{{ partial "admin/func/RemarshalCollections.html" . }}
