{{- $name := dict "name" "body" }}
{{- if eq site.Params.admin.cms "tinacms" }}
  {{- $name = dict "name" "llms_body" "nameOverride" "body" }}
{{- end }}

{{/* Shared by data/llms.yml and data/llms-full.yml, whose file label tells
     them apart */}}
{{- $args := dict
  "label" (i18n "admin.fields.body.label")
  "hint" (i18n "admin.fields.llms.hint")
  "i18n" false
  "minimal" (site.Params.admin.fields.llms.minimal | default false)
  "modes" (site.Params.admin.fields.llms.modes | default "['raw']")
  -}}

{{- $args = merge $args $name }}

