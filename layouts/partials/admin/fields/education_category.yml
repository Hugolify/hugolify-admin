{{/* Type of an education entry, published as the credentialCategory of the
     credential: a degree by default, a certificate otherwise. Left empty,
     the entry carries no category. The same in every language. */}}
{{- $name := dict "name" "category" }}
{{- if eq site.Params.admin.cms "tinacms" }}
  {{- $name = dict "name" "education_category" "nameOverride" "category" }}
{{- end }}

{{- $options := slice "degree" "certificate" }}
{{- $options = partial "admin/func/GetOptions.html" (dict "field" . "options" $options) -}}

{{- $args := dict
  "label" (i18n "admin.fields.education.category.label")
  "label_options" "admin.fields.education.category.options"
  "options" $options
  "default" "degree"
  "i18n" "duplicate"
  -}}

{{- $args = merge $args $name }}

{{ partial "admin/widgets/select.js" $args }}
