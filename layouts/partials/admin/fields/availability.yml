{{/* Availability of an offer, stored as its schema.org name — InStock,
     PreOrder… — shown on the page and published as availability in the
     structured data. Left empty, the offer is in stock, as it always was.

     Options come from the theme, func/GetSchemaEnumerations.html, so the
     select and the template reading it cannot drift apart. A pre-order, a
     pre-sale or a back order shows the day the product becomes available,
     availability_starts (Decap and Sveltia CMS, see the toggle option of
     widgets/select.js). The same in every language. */}}
{{- $options := slice "InStock" "OutOfStock" "PreOrder" -}}
{{- $starts := slice "PreOrder" -}}
{{- if templates.Exists "partials/func/GetSchemaEnumerations.html" -}}
  {{- $enums := partial "func/GetSchemaEnumerations.html" -}}
  {{- $options = $enums.availability -}}
  {{- $starts = $enums.starts -}}
{{- end -}}

{{- $toggle := dict -}}
{{- range $starts -}}
  {{- $toggle = merge $toggle (dict . (slice "availability_starts")) -}}
{{- end -}}

{{- $args := dict
  "label" (i18n "admin.fields.availability.label")
  "hint" (i18n "admin.fields.availability.hint")
  "name" "availability"
  "i18n" "duplicate"
  "options" $options
  "label_options" "admin.fields.availability.options"
  "toggle" $toggle
  -}}

{{ partial "admin/widgets/select.js" $args }}
