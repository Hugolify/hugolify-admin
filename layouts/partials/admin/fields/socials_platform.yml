{{/*
  `platform` select for the socials lists (contact socials).

  Profile-type networks only (person profiles with a URL); invite or
  workspace links (Discord, Slack, WhatsApp) are deliberately excluded.
  Slugs must match the Simple Icons brand slugs (hugolify-theme-icons):
  `x`, not `twitter` — a wrong slug renders without its icon in v2.
*/}}
{{- $options := slice "bluesky" 
  "facebook" 
  "github" 
  "gitlab" 
  "google" 
  "instagram" 
  "linkedin" 
  "mastodon" 
  "peertube" 
  "pinterest" 
  "threads" 
  "tiktok" 
  "twitch" 
  "vimeo" 
  "x" 
  "youtube" }}
{{- $options = partial "admin/func/GetOptions.html" (dict "field" . "options" $options) -}}

{{- $args := dict 
  "label" (i18n "admin.fields.socials.platform")
  "name" "platform"
  "required" true
  "options" $options
  -}}

{{ partial "admin/widgets/select.js" $args }}
