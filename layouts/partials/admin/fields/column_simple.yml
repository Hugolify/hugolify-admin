{{- $name := dict "name" "column" }}
{{- if eq site.Params.admin.cms "tinacms" }}
  {{- $name = dict "name" "column_simple" "nameOverride" "column" }}
{{- end }}

{{- /* No default: the block templates of the theme fall back to 1 column, and a
  CMS default would be written into every new block */ -}}
{{- $args := dict
  "label" (i18n "admin.fields.column.label")
  "name" "column"
  "min" 1
  "max" 2
  "step" 1
  "i18n" "duplicate"
  "range" true
  -}}

{{- $args = merge $args $name }}

{{ partial "admin/widgets/number.js" $args }}
