{{/* What a return gives back, stored as `refund`, its schema.org name —
     FullRefund… — published as refundType. Options come from the theme,
     func/GetSchemaEnumerations.html. */}}
{{- $options := slice "FullRefund" "ExchangeRefund" "StoreCreditRefund" -}}
{{- if templates.Exists "_partials/func/GetSchemaEnumerations.html" -}}
  {{- $options = (partial "func/GetSchemaEnumerations.html").refund_type -}}
{{- end -}}

{{- $args := dict
  "label" (i18n "admin.fields.return_refund.label")
  "name" "refund"
  "i18n" "duplicate"
  "options" $options
  "label_options" "admin.fields.return_refund.options"
  -}}

{{ partial "admin/widgets/select.js" $args }}
