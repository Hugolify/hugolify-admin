{{/* Postal address. Its country is a single select, stored as an ISO
     code and shown under its name in the language of the page, see
     country_code.yml. The free `country` an address held before is still
     read by the theme where the content keeps it, and a site wanting the
     field back adds it to its fields list.
*/}}

{{- $pin := cond (or (eq site.Params.admin.cms "decapcms") (eq site.Params.admin.cms "sveltiacms")) "location" "coordinates" -}}

{{- $fields := slice 
  "street" 
  "zipcode" 
  "city" -}}
{{- $fields = $fields | append "country_code" $pin -}}

{{- $fields = partial "admin/func/GetFields.html" (dict "field" . "fields" $fields) -}}

{{- $args := dict 
  "label" (i18n "admin.fields.address.label")
  "name" "address"
  "collapsed" true
  "fields" $fields
  -}}

{{ partial "admin/widgets/object.js" $args }}
