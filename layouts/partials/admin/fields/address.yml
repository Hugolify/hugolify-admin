{{/* Postal address.

     Params: {map} optional
       is_schema_only (bool) the address is never rendered, only published as
                      structured data. Drops the country name, which exists for
                      the visible <address>; the schema reads country_code.
*/}}
{{- $is_schema_only := false -}}
{{- if reflect.IsMap . -}}
  {{- with .is_schema_only -}}
    {{- $is_schema_only = true -}}
  {{- end -}}
{{- end -}}

{{- $pin := cond (or (eq site.Params.admin.cms "decapcms") (eq site.Params.admin.cms "sveltiacms")) "location" "coordinates" -}}

{{- $fields := slice 
  "street" 
  "zipcode" 
  "city" -}}
{{- if not $is_schema_only -}}
  {{- $fields = $fields | append "country" -}}
{{- end -}}
{{- $fields = $fields | append "country_code" $pin -}}

{{- $fields = partial "admin/func/GetFields.html" (dict "field" . "fields" $fields) -}}

{{- $args := dict 
  "label" (i18n "admin.fields.address.label")
  "name" "address"
  "collapsed" true
  "fields" $fields
  -}}

{{ partial "admin/widgets/object.js" $args }}
