{{/* Kind of return policy, stored as `category`, its schema.org name —
     MerchantReturnFiniteReturnWindow… — published as returnPolicyCategory.
     It shows the fields that apply: the days of a finite window, the fees,
     methods and refund of any policy that takes returns. Options come from
     the theme, func/GetSchemaEnumerations.html. */}}
{{- $options := slice "MerchantReturnFiniteReturnWindow" "MerchantReturnUnlimitedWindow" "MerchantReturnNotPermitted" -}}
{{- if templates.Exists "partials/func/GetSchemaEnumerations.html" -}}
  {{- $options = (partial "func/GetSchemaEnumerations.html").return_category -}}
{{- end -}}

{{- $args := dict
  "label" (i18n "admin.fields.return_category.label")
  "name" "category"
  "i18n" "duplicate"
  "options" $options
  "label_options" "admin.fields.return_category.options"
  "toggle" (dict
    "MerchantReturnFiniteReturnWindow" (slice "days" "fees" "methods" "refund")
    "MerchantReturnUnlimitedWindow" (slice "fees" "methods" "refund")
  )
  -}}

{{ partial "admin/widgets/select.js" $args }}
