{{/*
  `socials` list: platform, url and optional rel.

  The `rel` key is opt-in per entry: `me` marks the profile as the
  same identity (Mastodon / IndieWeb cross-verification).
*/}}
{{- $fields := slice 
  "socials_platform" 
  "url"
  "rel" -}}
{{- $fields = partial "admin/func/GetFields.html" (dict "field" . "fields" $fields) -}}

{{- $args := dict 
  "label" (i18n "admin.fields.socials.label" 2)
  "label_singular" (i18n "admin.fields.socials.label" 1)
  "name" "socials"
  "fields" $fields
  -}}

{{ partial "admin/widgets/list.js" $args }}
