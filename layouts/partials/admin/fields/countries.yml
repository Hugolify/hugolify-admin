{{/* Countries a policy applies in — the return policy, a shipping rate, in
     data/schema.yml — stored as their ISO 3166-1 alpha-2 codes (FR, BE…),
     what schema.org reads, and picked under their names, as for the country
     of an address (country_code.yml). Listed by func/GetCountryCodes.html
     and named by the theme, see func/GetNamedOptions.html. The same in
     every language. */}}
{{- $select := partial "admin/func/GetNamedOptions.html" (dict
  "field" .
  "codes" "admin/func/GetCountryCodes.html"
  "name" "func/GetCountryName.html"
) -}}

{{- $args := dict
  "label" (i18n "admin.fields.countries.label")
  "hint" (i18n "admin.fields.countries.hint")
  "name" "countries"
  "options" $select.options
  "label_options" $select.labels
  "multiple" true
  "i18n" "duplicate"
  -}}

{{ partial "admin/widgets/select.js" $args }}
