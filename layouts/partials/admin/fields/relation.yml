{{- $collection := .collection | default "pages" -}}
{{- $filters := .filters | default false -}}
{{- $display_fields := .display_fields | default (slice `"title"`) -}}
{{- $search_fields := .search_fields | default (slice `"title"`) -}}
{{- $name := .name | default $collection -}}
{{- $i18n := $collection -}}
{{- if ne .name "items" -}}
  {{- $i18n = $name -}}
{{- end -}}
{{- if or (strings.Contains $collection "posts_authors") (strings.Contains $collection "posts_categories") (strings.Contains $collection "posts_tags") -}}
  {{- $collection = replace $collection "posts_" "" -}} 
{{- end -}}
{{- $multiple := .multiple | default false -}}
{{- $required := .required | default false -}}
{{- $value_field := `{{slug}}` -}}
{{/* Decap CMS bug with bundle page (add /_index), we use title for taxonomies */}}
{{- if eq site.Params.admin.cms "cloudcannon" "decapcms" "netlifycms" "staticcms" -}}
  {{- with site.GetPage $collection -}}
    {{- if eq .Kind "taxonomy" -}}
      {{- $value_field = `{{title}}` -}}
    {{- end -}}
  {{- end -}}
  {{/* Same bug on a nested collection: every entry of it is a bundle, so {{slug}}
    writes "an-expertise/_index" and the taxonomy term is built on that key.
    The title resolves whatever the depth, func/GetRealContext (hugolify-theme)
    looks the page up by anchorized title when the folder name does not match.
    Taxonomy relations only: the "items" ones of the selected blocks are resolved
    by path, where the /_index suffix is harmless. */}}
  {{- if ne $name "items" -}}
    {{- with index site.Params.admin.collections $collection -}}
      {{- if .nested -}}
        {{- $value_field = `{{title}}` -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $value_field = cond site.Params.admin.config.id `{{id}}` $value_field -}}
{{/* Sveltia CMS lists the collection index file (_index.md) among the relation options, exclude it */}}
{{- if and (eq site.Params.admin.cms "sveltiacms") (not $filters) -}}
  {{- $filters = `[{ field: 'slug', values: ['_index'], exclude: true }]` -}}
{{- end -}}


{{- $args := dict 
  "label" (i18n (print "admin.collections." $i18n ".label"))
  "label_singular" (i18n (print "admin.collections." $i18n ".label") 1)
  "hint" (i18n (print "admin.collections." $i18n ".hint"))
  "name" $name
  "collection" $collection
  "display_fields" $display_fields
  "search_fields" $search_fields
  "value_field" $value_field
  "filters" $filters
  "multiple" $multiple
  "required" $required
  -}}

{{ partial "admin/widgets/relation.js" $args }}