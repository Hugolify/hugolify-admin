{{/* Education of a person: one entry per degree or school, listed on their
     page and published in their structured data — each entry with a title as
     a hasCredential, its school as alumniOf, see func/GetSchemaPerson.html in
     hugolify-theme.

     The title and the school are translated, a school may be named in the
     language of the page; the year and the type are the same in every
     language. Not in the default fields of the persons collection: a site
     lists it, and renders it on the person page. */}}
{{- $fields := slice
  "education_title"
  "education_school"
  "education_year"
  "education_category" -}}
{{- $fields = partial "admin/func/GetFields.html" (dict "field" . "fields" $fields) -}}

{{- $args := dict
  "label" (i18n "admin.fields.education.label" 2)
  "label_singular" (i18n "admin.fields.education.label" 1)
  "name" "education"
  "fields" $fields
  "summary" "{{fields.title}}"
  -}}

{{ partial "admin/widgets/list.js" $args }}
